name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  WINE_TAG: wine-11.0

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64 bison flex

      - name: Fetch Wine ${{ env.WINE_TAG }}
        run: git clone --depth 1 --branch "$WINE_TAG" https://github.com/wine-mirror/wine.git wine

      - name: Apply patch
        run: git -C wine apply ../mfplat-shared-textures.patch

      - name: Configure
        run: cd wine && ./configure --enable-win64 --without-x --without-freetype --disable-tests

      - name: Build mfplat.dll
        run: cd wine && make -j"$(nproc)" dlls/mfplat/x86_64-windows/mfplat.dll && cp dlls/mfplat/x86_64-windows/mfplat.dll ..

      - name: Checksums
        run: sha256sum mfplat.dll | tee SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: mfplat.dll
          path: |
            mfplat.dll
            SHA256SUMS

      - name: Attest build provenance
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: mfplat.dll

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            mfplat.dll
            SHA256SUMS
